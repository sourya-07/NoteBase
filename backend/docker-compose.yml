version: "3.9"

services:
  # RAG Application (ChromaDB runs embedded — no separate server needed)
  app:
    build: .
    container_name: sourya_rag_app
    ports:
      - "${APP_PORT:-7860}:7860"
    volumes:
      # Persist ChromaDB data across container restarts
      - chroma_data:/app/chroma_data
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_data
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama3-8b-8192}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      EMBED_MODEL: ${EMBED_MODEL:-all-MiniLM-L6-v2}
      EMBED_DIM: ${EMBED_DIM:-384}
      TOP_K: ${TOP_K:-5}
      RERANK_TOP_N: ${RERANK_TOP_N:-3}
      CHUNK_SIZE: ${CHUNK_SIZE:-200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-40}
      APP_HOST: "0.0.0.0"
      APP_PORT: "7860"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7860/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  chroma_data:
    driver: local
